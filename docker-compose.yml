services:
  postgres:
    image: postgres:16-alpine
    container_name: agentguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentguard
      POSTGRES_PASSWORD: agentguard
      POSTGRES_DB: agentguard
    ports:
      - "5432:5432"
    volumes:
      - agentguard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentguard -d agentguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: agentguard-jaeger
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:16686:16686"

volumes:
  agentguard-postgres-data:
